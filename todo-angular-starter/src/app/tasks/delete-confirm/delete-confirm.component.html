<div class="slds-modal slds-fade-in-open" role="dialog" aria-modal="true">
  <div class="slds-modal__container">
    <header class="slds-modal__header slds-modal__header_empty slds-theme_alert-texture">
      <h2 class="slds-text-heading_medium">Delete</h2>
    </header>
    <div class="slds-modal__content slds-p-around_medium">
      <p>Do you want to delete task "{{ task?.assignedTo }}"?</p>
    </div>
    <footer class="slds-modal__footer">
      <button class="slds-button" (click)="cancel.emit()">No</button>
      <button class="slds-button slds-button_brand" (click)="confirm.emit()">Yes</button>
    </footer>
  </div>
</div>
<div class="slds-backdrop slds-backdrop_open"></div>
